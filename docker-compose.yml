# Quaymaster (.NET) — container deployment / local stack.
#   cp .env.example .env     # set QM_SECRET_KEY (see docs/DEPLOY.md: `gen-secret`), QM_STACK_PATHS, ...
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose up -d --build
# The Docker socket is root-equivalent. Published on 127.0.0.1 only; put a TLS reverse proxy in front for remote access.
name: quaymaster-net
services:
  quaymaster-net:
    build: .
    image: ${DEPLOY_IMAGE:-quaymaster-net:dev}
    container_name: quaymaster-net
    restart: unless-stopped
    user: '10001:10001'
    # Socket access without root: join the host's docker group at run time (the image never hard-codes a GID).
    group_add: ['${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}']
    env_file:
      - path: .env
        required: false
    environment:
      QM_HOST: 0.0.0.0 # inside the container; exposure is controlled by the port mapping below
      QM_PORT: '8787'
      QM_DATA_DIR: /var/lib/quaymaster-net
      QM_DOCKER_SOCKET: /var/run/docker.sock
      QM_SELF_CONTAINER: quaymaster-net # self-protection; also auto-detected from /proc/self/mountinfo
    ports:
      - '${DEPLOY_BIND:-127.0.0.1}:${DEPLOY_PORT:-8787}:8787'
    volumes:
      - qmdata:/var/lib/quaymaster-net
      - /var/run/docker.sock:/var/run/docker.sock
      # Updates/redeploys need every stack directory mounted at the IDENTICAL host path (Compose resolves relative
      # bind mounts on the host), e.g. add `- /opt/stacks:/opt/stacks` and set QM_STACK_PATHS=/opt/stacks in .env.
      # Optional free-space checks: mount the Docker root read-only and set QM_DOCKER_ROOT_MOUNT to that path.
      #   - /var/lib/docker:/var/lib/docker:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    labels:
      quaymaster.role: 'self' # informational marker

volumes:
  qmdata:
