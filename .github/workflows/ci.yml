name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start test fixtures (Docker Compose)
        env:
          DOCKER_GID: '999'
        run: |
          cd test-fixtures
          docker compose up -d --wait
          cd ..
      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - name: Docker image build (no push)
        run: docker build -t quaymaster-net:ci .
      - name: Image smoke test (no Docker socket)
        run: |
          set -eu
          secret="$(docker run --rm quaymaster-net:ci dotnet /app/Quaymaster.Api.dll gen-secret | sed -n 's/^QM_SECRET_KEY=//p')"
          test -n "$secret"
          cid="$(docker run -d -p 127.0.0.1:18787:8787 -e QM_SECRET_KEY="$secret" quaymaster-net:ci)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/healthz | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: betterleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/betterleaks/betterleaks:v1.10.1 \
            git --no-banner --redact -c /repo/.betterleaks.toml /repo
